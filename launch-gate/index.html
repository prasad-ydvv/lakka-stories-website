<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e7">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="LAKKA STORIES — traditional Indian craftsmanship with a modern approach to gifting. Our online store is getting ready.">
  <title>LAKKA STORIES — Coming Soon</title>
  <style>
    :root {
      color-scheme: light;
      --cream: #f7f1e7;
      --paper: #fffdf8;
      --maroon: #641f32;
      --maroon-dark: #431321;
      --gold: #b58a45;
      --ink: #342a27;
      --muted: #786d64;
      --line: rgba(100, 31, 50, .16);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(ellipse at 12% 10%, rgba(181,138,69,.12), transparent 34%),
        radial-gradient(ellipse at 88% 92%, rgba(100,31,50,.08), transparent 34%),
        var(--cream);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      width: min(100%, 760px);
      padding: clamp(34px, 7vw, 76px) clamp(24px, 7vw, 70px);
      text-align: center;
      background: rgba(255,253,248,.88);
      border: 1px solid var(--line);
      box-shadow: 0 22px 70px rgba(67,19,33,.08);
      position: relative;
    }
    main::before, main::after {
      content: "";
      position: absolute;
      width: 34px;
      height: 34px;
      border-color: var(--gold);
      opacity: .8;
    }
    main::before { top: 16px; left: 16px; border-top: 1px solid; border-left: 1px solid; }
    main::after { right: 16px; bottom: 16px; border-right: 1px solid; border-bottom: 1px solid; }
    .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      margin-bottom: 20px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--maroon);
      font-size: 22px;
      letter-spacing: .02em;
    }
    .brand {
      margin: 0;
      color: var(--maroon);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 6vw, 48px);
      font-weight: 600;
      letter-spacing: .12em;
    }
    .rule {
      width: 78px;
      height: 1px;
      margin: 24px auto;
      background: var(--gold);
    }
    .eyebrow {
      margin: 0 0 14px;
      color: var(--gold);
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    h2 {
      max-width: 560px;
      margin: 0 auto;
      color: var(--maroon-dark);
      font-size: clamp(27px, 5vw, 42px);
      font-weight: 500;
      line-height: 1.18;
    }
    .message {
      max-width: 480px;
      margin: 20px auto 0;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.8;
    }
    footer {
      margin-top: 42px;
      color: #8a7d71;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    @media (max-width: 420px) {
      main { padding-top: 48px; padding-bottom: 48px; }
      .message { font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">ल</div>
    <h1 class="brand">LAKKA STORIES</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="eyebrow">A thoughtful new experience is taking shape</p>
    <h2>Tradition, thoughtfully brought to gifting.</h2>
    <p class="message">We are preparing a new online home for traditional Indian craftsmanship and meaningful gifts. Our store will be ready soon.</p>
    <footer>Made with care · LAKKA STORIES</footer>
  </main>
</body>
</html>
